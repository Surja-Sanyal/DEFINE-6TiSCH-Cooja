name: Cooja 6TiSCH Full Campaign Sweep

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    container: contiker/contiki-ng:latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [1, 2, 3, 4, 5, 6, 7, 8]
        nodes: [50, 250, 500]              # 3 density points
        sf_len: [23, 61, 101]              # 3 slotframe points
        eb_mult: [1, 2, 4]                 # 3 EB interval variations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Cooja Headless Simulation
        run: |
          mkdir -p /home/user
          ln -sfn "$GITHUB_WORKSPACE/contiki-ng-define" /home/user/contiki-ng

          # Self-healing check: if tools/cooja is missing or empty, clone it automatically
          if [ ! -f "/home/user/contiki-ng/tools/cooja/build.gradle" ]; then
            echo "tools/cooja missing from repo checkout, cloning Cooja..."
            rm -rf /home/user/contiki-ng/tools/cooja
            git clone --depth 1 --recursive https://github.com/contiki-ng/cooja.git /home/user/contiki-ng/tools/cooja
          fi

          # Clear pre-existing Statistics files so each container only uploads its own newly generated row
          rm -rf Statistics/*

          python3 -c "import scripts.run_cooja_headless as r; r.run_cooja_and_parse(scheme_id=${{ matrix.scheme }}, n_nodes=${{ matrix.nodes }}, area=200, n_ch=16, sf_len=${{ matrix.sf_len }}, eb_mult=${{ matrix.eb_mult }}, use_z1=False)"

      - name: Upload Statistics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats-s${{ matrix.scheme }}-n${{ matrix.nodes }}-sf${{ matrix.sf_len }}-eb${{ matrix.eb_mult }}
          path: Statistics/
          retention-days: 1

  merge-and-plot:
    needs: simulate
    if: always()
    runs-on: ubuntu-latest
    container: contiker/contiki-ng:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All 216 Partial Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stats-s*
          path: tmp_artifacts

      - name: Merge All Partial Statistics and Plot
        run: |
          python3 -c '
          import os, glob

          os.makedirs("Statistics", exist_ok=True)
          merged = {}

          for filepath in sorted(glob.glob("tmp_artifacts/**/*_stats_*.txt", recursive=True)):
              fname = os.path.basename(filepath)
              with open(filepath, "r") as f:
                  lines = [line.strip() for line in f if line.strip()]
              merged.setdefault(fname, []).extend(lines)

          for fname, lines in merged.items():
              unique_lines = list(dict.fromkeys(lines))
              out_path = os.path.join("Statistics", fname)
              with open(out_path, "w") as f:
                  f.write("\n".join(unique_lines) + "\n")
              print(f"Merged {len(unique_lines)} rows into {out_path}")
          '

          if [ -f "scripts/plot_results.py" ]; then
            python3 scripts/plot_results.py || echo "Plotting script warning, continuing..."
          fi

      - name: Upload Unified Final Results & Plots
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-MERGED-COOJA-RESULTS
          path: |
            Statistics/
            *.png
            Plots/

      - name: Auto-Commit Merged Results to Repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Statistics/ *.png Plots/ 2>/dev/null || git add Statistics/
          git diff --staged --quiet || (git commit -m "Auto-update merged 216-job Cooja statistics and plots" && git pull --rebase origin main && git push origin main)