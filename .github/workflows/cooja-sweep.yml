name: Cooja 6TiSCH Full Campaign Sweep

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    container: contiker/contiki-ng:latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [1, 2, 3, 4, 5, 6, 7, 8]
        nodes: [50, 250, 500]              # 3 density points
        sf_len: [23, 61, 101]              # 3 slotframe points
        eb_mult: [1, 2, 4]                 # 3 EB interval variations

    steps:
      - name: Checkout repository & submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Cooja Headless Simulation
        run: |
          apt-get update && apt-get install -y python3-pip
          pip3 install numpy matplotlib --break-system-packages

          python3 -c "import scripts.run_cooja_headless as r; r.run_cooja_and_parse(scheme_id=${{ matrix.scheme }}, n_nodes=${{ matrix.nodes }}, area=200, n_ch=16, sf_len=${{ matrix.sf_len }}, eb_mult=${{ matrix.eb_mult }}, use_z1=False)"

      - name: Upload Statistics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats-s${{ matrix.scheme }}-n${{ matrix.nodes }}-sf${{ matrix.sf_len }}-eb${{ matrix.eb_mult }}
          path: Statistics/